<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AlgoAtlas</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-container">
  <div class="header-stats">
    <div style="display: flex; align-items: center; gap: 12px;">
      <i class="ti ti-code" style="font-size: 28px; color: #3b82f6;"></i>
      <h1>FAANG DSA Pattern Vault<br><span style="font-size: 0.75rem; font-weight: normal; background: none; color: #475569;">34 Patterns · 680+ LeetCode Problems</span></h1>
    </div>
    <div class="stats-group">
      <div class="stat-badge"><i class="ti ti-checks"></i> <span id="totalSolved">0</span> / <span id="totalProblems">0</span> solved</div>
      <div class="stat-badge"><i class="ti ti-chart-pie"></i> FAANG progression</div>
    </div>
    <div class="sync-status" id="syncStatus" data-state="idle">Local only</div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to night mode">
      <span class="theme-symbol" aria-hidden="true">☾</span>
      <span>Night</span>
    </button>
    <div class="chart-wrapper">
      <canvas id="progressChart" width="180" height="80" style="max-width: 140px;"></canvas>
    </div>
  </div>

  <div class="dashboard">
    <div class="patterns-panel">
      <div class="search-section">
        <i class="ti ti-search" style="color:#6c86a3;"></i>
        <input type="text" id="globalSearch" placeholder="🔍 Search patterns, problems, topics..." autocomplete="off">
      </div>
      <div id="phasesContainer"></div>
    </div>

    <div class="problems-panel" id="problemPanel">
      <div class="problem-header">
        <div class="flex-between">
          <div><i class="ti ti-list-details"></i> <strong id="selectedPatternName">Select a pattern</strong></div>
          <div class="text-small" id="patternStats">0/0 problems</div>
        </div>
        <div class="text-small" style="margin-top: 8px;">✔️ check problems → progress updates | ✏️ add custom tags, notes, video links</div>
      </div>
      <div id="problemListContainer" class="problem-list">
        <div class="empty-state">✨ Click any pattern card to see FAANG-level curated problems</div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
